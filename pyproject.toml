[project]
name = "rbyb-publication-data"
version = "1.0.0"
description = "Numerical data and simulations supporting the Rb-Yb Rydberg interaction paper"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.3.5",
    "pairinteraction==2.5.0",
    "scipy==1.17.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
